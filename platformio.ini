[env:esp32s3-eink]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=5
lib_deps =
  olikraus/U8g2 @ ^2.35.30
  https://github.com/tzapu/WiFiManager.git
